<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="330" y="38" font-size="22" font-weight="bold" fill="#1f2328">Sorting conveyor - reference wiring</text>

  <!-- Raspberry Pi -->
  <rect x="20" y="80" width="250" height="370" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="38" y="108" font-size="16" font-weight="bold" fill="#1f2328">Raspberry Pi 5</text>
  <text x="38" y="127" font-size="12" fill="#444">GPIO numbers are proposed</text>

  <rect x="40" y="145" width="210" height="46" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="173" font-size="14" fill="#1f2328">GPIO17 - motor IN1</text>
  <rect x="40" y="205" width="210" height="46" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="233" font-size="14" fill="#1f2328">GPIO27 - motor IN2</text>
  <rect x="40" y="265" width="210" height="46" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="293" font-size="14" fill="#1f2328">GPIO22 - motor EN (PWM)</text>
  <rect x="40" y="325" width="210" height="46" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="353" font-size="14" fill="#1f2328">GPIO18 - servo signal</text>
  <rect x="40" y="385" width="210" height="46" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="52" y="413" font-size="14" fill="#1f2328">GPIO24 - buzzer</text>

  <!-- signal lines Pi -> PCB -->
  <line x1="270" y1="168" x2="410" y2="168" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="228" x2="410" y2="228" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="288" x2="410" y2="288" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="348" x2="410" y2="348" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="408" x2="410" y2="408" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PCB -->
  <rect x="410" y="80" width="260" height="370" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="428" y="108" font-size="16" font-weight="bold" fill="#1f2328">Class-built PCB</text>
  <rect x="428" y="135" width="224" height="180" rx="6" fill="#fff" stroke="#3b6fb6"/>
  <text x="440" y="160" font-size="14" font-weight="bold" fill="#1f2328">L293D driver (channel 1)</text>
  <text x="440" y="185" font-size="13" fill="#1f2328">IN1 (pin 2)</text>
  <text x="440" y="245" font-size="13" fill="#1f2328">IN2 (pin 7)</text>
  <text x="440" y="305" font-size="13" fill="#1f2328">EN1 (pin 1)</text>
  <rect x="428" y="325" width="224" height="46" rx="6" fill="#fff" stroke="#3b6fb6"/>
  <text x="440" y="353" font-size="14" fill="#1f2328">SERVO1 header</text>
  <rect x="428" y="385" width="224" height="46" rx="6" fill="#fff" stroke="#3b6fb6"/>
  <text x="440" y="413" font-size="14" fill="#1f2328">Buzzer</text>

  <!-- outputs -->
  <rect x="760" y="150" width="220" height="90" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="774" y="180" font-size="15" font-weight="bold" fill="#1f2328">DC gear motor</text>
  <text x="774" y="203" font-size="13" fill="#1f2328">Belt drive, via DC MOTOR</text>
  <text x="774" y="221" font-size="13" fill="#1f2328">terminal (OUT1, OUT2)</text>
  <line x1="670" y1="195" x2="760" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="318" width="220" height="60" rx="8" fill="#f3ecfa" stroke="#7d3c98" stroke-width="2"/>
  <text x="774" y="345" font-size="15" font-weight="bold" fill="#1f2328">Servo - sorting gate</text>
  <text x="774" y="365" font-size="13" fill="#1f2328">Signal, 5 V, GND</text>
  <line x1="670" y1="348" x2="760" y2="348" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <text x="690" y="425" font-size="12" fill="#444">IR1 and SERVO2 headers exist on the</text>
  <text x="690" y="441" font-size="12" fill="#444">PCB. The reference software does not</text>
  <text x="690" y="457" font-size="12" fill="#444">use them.</text>

  <!-- 12V supply -->
  <rect x="428" y="520" width="224" height="64" rx="8" fill="#fff4e5" stroke="#d98200" stroke-width="2"/>
  <text x="442" y="548" font-size="15" font-weight="bold" fill="#1f2328">12 V DC supply</text>
  <text x="442" y="568" font-size="13" fill="#1f2328">to the 12V / GND terminal</text>
  <line x1="540" y1="520" x2="540" y2="452" stroke="#d98200" stroke-width="3" marker-end="url(#arr)"/>

  <!-- camera -->
  <rect x="40" y="520" width="210" height="64" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="54" y="548" font-size="15" font-weight="bold" fill="#1f2328">Raspberry Pi Camera</text>
  <text x="54" y="568" font-size="13" fill="#1f2328">CSI ribbon cable</text>
  <line x1="145" y1="520" x2="145" y2="452" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <text x="20" y="615" font-size="12" fill="#444">Reference wiring for rebuilding. The original PCB's pin mapping was not recorded, so GPIO numbers match software/config.py.</text>
  <text x="20" y="632" font-size="12" fill="#444">Check against your own board before powering the motor. Overview only, not a PCB layout.</text>
</svg>
